<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="798" height="238" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Left Icon: Markdown Shield + Translation Symbol -->
  <g transform="translate(60, 40)">
    <!-- Tech Outer Hexagon/Shield -->
    <path d="M 80 0 L 150 40 L 150 120 L 80 160 L 10 120 L 10 40 Z" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Markdown "M" mark -->
    <path d="M 40 100 L 40 60 L 60 80 L 80 60 L 80 100" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Translation Arrows & Global Character (文) -->
    <path d="M 100 80 L 125 80 M 118 73 L 125 80 L 118 87" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Math Formula Accent Symbols (LaTeX / Integral / Sigma) -->
    <text x="32" y="30" font-family="monospace, serif" font-size="18" font-weight="bold" fill="#38bdf8" opacity="0.85">∑</text>
    <text x="110" y="32" font-family="monospace, serif" font-size="18" font-style="italic" fill="#fb923c" opacity="0.85">∫dx</text>
    <text x="100" y="125" font-family="monospace" font-size="16" fill="#a855f7" opacity="0.85">&lt;/&gt;</text>
  </g>

  <!-- Project Title and Typography -->
  <g transform="translate(260, 95)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" letter-spacing="-0.03em">
      md<tspan fill="url(#primaryGrad)">-translate</tspan>
    </text>
    
    <!-- Badge-style Slogan -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Zero-Loss Markdown &amp; LaTeX Translator
    </text>

    <!-- Tech Tags / Capabilities -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="86" height="22" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
      <text x="43" y="15" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Apple MPS</text>

      <rect x="94" y="0" width="76" height="22" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#6366f1" stroke-width="1" />
      <text x="132" y="15" font-family="monospace" font-size="11" font-weight="bold" fill="#a5b4fc" text-anchor="middle">NLLB-200</text>

      <rect x="178" y="0" width="86" height="22" rx="6" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
      <text x="221" y="15" font-family="monospace" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle">Agent MCP</text>

      <rect x="272" y="0" width="94" height="22" rx="6" fill="#be123c" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1" />
      <text x="319" y="15" font-family="monospace" font-size="11" font-weight="bold" fill="#fda4af" text-anchor="middle">Math &amp; Code</text>
    </g>
  </g>
</svg>
