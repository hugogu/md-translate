name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies & test
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python3 -c "import sys; sys.path.insert(0, 'src'); from tests.test_translation import test_markdown_protector_integrity, test_full_pipeline_with_echo_engine; test_markdown_protector_integrity(); test_full_pipeline_with_echo_engine(); print('ALL TESTS PASS')"

  publish:
    name: Publish md-translate-mcp to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Mandatory for PyPI Trusted Publisher (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
